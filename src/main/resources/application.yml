spring:
  application:
    name: resource-booking-system

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        highlight_sql: true

        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true

  jackson:
    default-property-inclusion: non_null

    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION:86400000}
    cors:
       allowed-origins: ${ALLOWED_HOSTS:http://localhost:3000,http://localhost:4200}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: ${LOG_SQL_LEVEL:OFF}
    org.hibernate.orm.results: ${LOG_BIND_LEVEL:OFF}
